# Dovecot 2.3 Configuration - FlutterFlirt Mail Engine

protocols = imap lmtp sieve
listen = *

# Logging to stdout/stderr for Docker
log_path = /dev/stderr
info_log_path = /dev/stdout
debug_log_path = /dev/stdout
auth_debug = yes
mail_debug = yes

# User & group for mail storage
mail_uid = 5000
mail_gid = 5000
mail_home = /var/mail/vhosts/%d/%n
mail_location = maildir:/var/mail/vhosts/%d/%n:LAYOUT=fs

# TLS configuration
ssl = yes
ssl_cert = </etc/ssl/certs/fullchain.pem
ssl_key = </etc/ssl/certs/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_cipher_list = HIGH:!aNULL:!MD5

# Authentication
auth_mechanisms = plain login
auth_master_user_separator = *

passdb {
  driver = passwd-file
  master = yes
  args = /etc/dovecot/master-users
  pass = yes
}

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# IMAP Service
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# LMTP Service for Postfix (Port 24)
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# SASL Auth listener for Postfix
service auth {
  inet_listener {
    port = 12345
  }
}

# Sieve & LMTP filtering
protocol lmtp {
  mail_plugins = $mail_plugins sieve quota
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
}

plugin {
  quota = maildir:User quota
  quota_rule = *:storage=10G
  quota_grace = 10%%
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_default = /etc/dovecot/sieve/default.sieve
}

# Standard Mailboxes & Auto-Creation
namespace inbox {
  inbox = yes

  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

