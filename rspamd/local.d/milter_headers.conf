# Rspamd Milter Headers configuration
extended_spam_headers = true;
use = ["x-spamd-result", "x-rspamd-server", "x-spam", "authentication-results"];
routines {
  authentication_results {
    header = "Authentication-Results";
    add_smtp_user = false;
  }
  x_spam {
    header = "X-Spam";
    value = "Yes";
  }
}

