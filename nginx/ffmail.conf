# Nginx Reverse Proxy Configuration - FlutterFlirt Mail

upstream backend_api {
    server backend:8080;
}

upstream frontend_ui {
    server frontend:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.flutterflirt.com autoconfig.*;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.flutterflirt.com autoconfig.*;

    ssl_certificate /etc/letsencrypt/live/mail.flutterflirt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.flutterflirt.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Route /api/ directly to Node.js / Express backend
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route autoconfig XML to backend
    location /.well-known/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    location /mail/config-v1.1.xml {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    # All Web UI routes go to Next.js
    location / {
        proxy_pass http://frontend_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

